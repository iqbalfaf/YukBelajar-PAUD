<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Shield / Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="34" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="4"/>
  
  <!-- Little Sparkles -->
  <path d="M 98 24 Q 98 34 108 34 Q 98 34 98 44 Q 98 34 88 34 Q 98 34 98 24 Z" fill="#FEF08A"/>
  <path d="M 28 86 Q 28 92 34 92 Q 28 92 28 98 Q 28 92 22 92 Q 28 92 28 86 Z" fill="#FEF08A"/>

  <!-- Main Golden Glowing Star -->
  <path d="M 64 20 
           L 76.5 48.5 
           L 107 52 
           L 84 73 
           L 91 103 
           L 64 87.5 
           L 37 103 
           L 44 73 
           L 21 52 
           L 51.5 48.5 Z" 
        fill="url(#starGrad)" 
        stroke="#D97706" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Star Highlight -->
  <path d="M 64 28 L 73 48.5 L 94 51 L 78 65.5 L 64 45 Z" fill="#FFFFFF" opacity="0.4"/>
</svg>
