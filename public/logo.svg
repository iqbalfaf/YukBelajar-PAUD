<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="logoStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Container -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#logoBgGrad)" stroke="#38BDF8" stroke-width="3.5"/>
    
    <!-- Sparkles -->
    <path d="M 80 18 Q 80 26 88 26 Q 80 26 80 34 Q 80 26 72 26 Q 80 26 80 18 Z" fill="#FEF08A"/>
    <path d="M 22 72 Q 22 78 28 78 Q 22 78 22 84 Q 22 78 16 78 Q 22 78 22 72 Z" fill="#FEF08A"/>

    <!-- Star -->
    <path d="M 50 16 
             L 60 39 
             L 85 42 
             L 66 59 
             L 72 84 
             L 50 71 
             L 28 84 
             L 34 59 
             L 15 42 
             L 40 39 Z" 
          fill="url(#logoStarGrad)" 
          stroke="#D97706" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#logoGlow)"/>
    <path d="M 50 22 L 57 39 L 74 41 L 61 53 L 50 36 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(126, 22)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', sans-serif" font-size="44" font-weight="900" fill="#0369A1" letter-spacing="-0.5">
      YukBelajar <tspan fill="#F59E0B">PAUD</tspan>
    </text>
    
    <!-- Subtitle Pill Badge -->
    <rect x="0" y="58" width="280" height="26" rx="13" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="12" y="75" font-family="'Quicksand', sans-serif" font-size="12" font-weight="800" fill="#0284C7" letter-spacing="0.5">
      ⭐ GAME BELAJAR &amp; KUIS BERGAMBAR CERIA
    </text>
  </g>
</svg>
